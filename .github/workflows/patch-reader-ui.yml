name: Apply reader footer and menu cleanup

on:
  push:
    branches: [feature/chat-read-ui]
    paths:
      - .github/workflows/patch-reader-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-read-ui
          fetch-depth: 0

      - name: Patch UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("main/main.cpp")
          s = p.read_text()

          old = """    {'0', {14,17,19,21,25,17,14}}, {'1', {4,12,4,4,4,4,14}},
    {'4', {2,6,10,18,31,2,2}}, {'5', {31,16,16,30,1,1,30}},
"""
          new = """    {'0', {14,17,19,21,25,17,14}}, {'1', {4,12,4,4,4,4,14}},
    {'2', {14,17,1,2,4,8,31}}, {'3', {30,1,1,14,1,1,30}},
    {'4', {2,6,10,18,31,2,2}}, {'5', {31,16,16,30,1,1,30}},
"""
          if old not in s:
              raise SystemExit("digit glyph block not found")
          s = s.replace(old, new, 1)

          s = s.replace('        DrawText(fb, 95, 278, "CHAT MENU", 3);\n', '', 1)
          s = s.replace('        DrawText(fb, 85, 278, "READER MENU", 3);\n', '', 1)

          for old_y, new_y in [(335, 290), (390, 355), (445, 420), (500, 485)]:
              s = s.replace(f'DrawText(fb, 72, {old_y},', f'DrawText(fb, 72, {new_y},')

          old_footer = """    char page[48] = {};
    std::snprintf(page, sizeof(page), "PAGE %d OF %d",
                  s_reader_page + 1, beta_reader::PageCount());
    const int footer_width = static_cast<int>(std::strlen(page)) * 6;
    DrawText(fb, (kPortraitWidth - footer_width) / 2, 786, page, 1);
"""
          new_footer = """    const std::string page =
        "Page " + std::to_string(s_reader_page + 1) + " of " +
        std::to_string(beta_reader::PageCount());
    const int footer_width = beta_reader::ReaderFontMeasure(page);
    DrawReaderText(fb, (kPortraitWidth - footer_width) / 2, 766, page);
"""
          if old_footer not in s:
              raise SystemExit("reader footer block not found")
          s = s.replace(old_footer, new_footer, 1)

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "CLANKER CI"
          git config user.email "clanker-ci@users.noreply.github.com"
          git add main/main.cpp
          git commit -m "Polish reader footer and menus"
          git push origin HEAD:feature/chat-read-ui
