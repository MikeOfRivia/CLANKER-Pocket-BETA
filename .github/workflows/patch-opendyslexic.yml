name: Apply OpenDyslexic reader font

on:
  push:
    branches: [feature/chat-read-ui]
    paths:
      - .github/workflows/patch-opendyslexic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-read-ui
          fetch-depth: 0

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download OpenDyslexic Regular
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/flxzt/rnote/db9eccd8d3dc01be01feb2090a18ccfbc3a54c92/crates/rnote-engine/data/fonts/OpenDyslexic-Regular.ttf" \
            -o /tmp/OpenDyslexic-Regular.ttf

      - name: Generate reader bitmap font
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          font_path = "/tmp/OpenDyslexic-Regular.ttf"
          font_size = 20
          first = 0x20
          last = 0x7E
          baseline_px = 22
          line_height_px = 29

          font = ImageFont.truetype(font_path, font_size)

          bitmaps = bytearray()
          glyphs = []

          for code in range(first, last + 1):
              ch = chr(code)
              bbox = font.getbbox(ch, anchor="ls")
              if bbox is None:
                  bbox = (0, 0, 0, 0)
              x0, y0, x1, y1 = [int(v) for v in bbox]
              width = max(0, x1 - x0)
              height = max(0, y1 - y0)
              advance = max(1, int(round(font.getlength(ch))))

              # Space and any zero-area glyphs carry no bitmap bytes.
              offset = len(bitmaps)
              if width > 0 and height > 0:
                  img = Image.new("1", (width, height), 0)
                  draw = ImageDraw.Draw(img)
                  # Put the glyph's left-baseline bbox at bitmap origin.
                  draw.text((-x0, -y0), ch, font=font, fill=1, anchor="ls")

                  pending = 0
                  nbits = 0
                  for y in range(height):
                      for x in range(width):
                          pending = (pending << 1) | (1 if img.getpixel((x, y)) else 0)
                          nbits += 1
                          if nbits == 8:
                              bitmaps.append(pending)
                              pending = 0
                              nbits = 0
                  if nbits:
                      bitmaps.append(pending << (8 - nbits))

              glyphs.append((offset, width, height, advance, x0, y0, code))

          min_top = min(g[5] for g in glyphs)
          max_bottom = max(g[5] + g[2] for g in glyphs)
          if baseline_px + min_top < 0:
              raise SystemExit(
                  f"OpenDyslexic top clips: baseline {baseline_px}, min yOffset {min_top}")
          if baseline_px + max_bottom > line_height_px:
              raise SystemExit(
                  f"OpenDyslexic bottom clips: baseline {baseline_px}, max bottom {max_bottom}, "
                  f"line height {line_height_px}")

          def bline(chunk):
              return ", ".join(f"0x{b:02X}" for b in chunk)

          lines = [
              "#pragma once",
              "// OpenDyslexic Regular, rasterized as a 1-bit ASCII subset for CLANKER Pocket.",
              "// Source font: OpenDyslexic-Regular.ttf bundled by Rnote at commit",
              "// db9eccd8d3dc01be01feb2090a18ccfbc3a54c92.",
              "// Raster size: 20 px. ASCII 0x20-0x7E.",
              "",
              "const uint8_t OpenDyslexic20pxBitmaps[] PROGMEM = {",
          ]
          for i in range(0, len(bitmaps), 12):
              lines.append("    " + bline(bitmaps[i:i+12]) + ",")
          lines += [
              "};",
              "",
              "const GFXglyph OpenDyslexic20pxGlyphs[] PROGMEM = {",
          ]

          for offset, width, height, advance, xoff, yoff, code in glyphs:
              display = chr(code)
              if display == "\\":
                  display = "\\\\"
              elif display == "'":
                  display = "\\'"
              lines.append(
                  f"    {{{offset}, {width}, {height}, {advance}, {xoff}, {yoff}}},"
                  f" // 0x{code:02X} '{display}'"
              )

          lines += [
              "};",
              "",
              "const GFXfont OpenDyslexic20px PROGMEM = {",
              "    (uint8_t *)OpenDyslexic20pxBitmaps,",
              "    (GFXglyph *)OpenDyslexic20pxGlyphs,",
              "    0x20, 0x7E, 29};",
              "",
          ]

          Path("components/beta_reader/reader_font_data.h").write_text(
              "\n".join(lines), encoding="utf-8")

          cpp_path = Path("components/beta_reader/reader_font.cpp")
          cpp = cpp_path.read_text()
          cpp = cpp.replace("FreeSerif12pt7bGlyphs", "OpenDyslexic20pxGlyphs")
          cpp = cpp.replace("FreeSerif12pt7bBitmaps", "OpenDyslexic20pxBitmaps")
          cpp_path.write_text(cpp)

          hdr_path = Path("components/beta_reader/reader_font.h")
          hdr = hdr_path.read_text()
          hdr = hdr.replace(
              "// FreeSerif 12 pt rasterized as a 1-bit ASCII subset. The bitmap is vendored\n"
              "// from Adafruit-GFX's generated FreeSerif12pt7b font data.\n",
              "// OpenDyslexic Regular rasterized at 20 px as a 1-bit ASCII subset.\n"
              "// Reader geometry stays unchanged so existing pagination/layout behavior remains stable.\n"
          )
          hdr_path.write_text(hdr)

          print(
              f"Generated {len(bitmaps)} bitmap bytes; "
              f"vertical bbox {min_top}..{max_bottom}; "
              f"baseline={baseline_px}; lineHeight={line_height_px}"
          )
          PY

      - name: Commit font swap
        run: |
          git config user.name "CLANKER CI"
          git config user.email "clanker-ci@users.noreply.github.com"
          git add components/beta_reader/reader_font_data.h \
                  components/beta_reader/reader_font.cpp \
                  components/beta_reader/reader_font.h
          git rm .github/workflows/patch-opendyslexic.yml
          git commit -m "Use OpenDyslexic for reader text"
          git push origin HEAD:feature/chat-read-ui
